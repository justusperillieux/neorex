name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Neovim and Lua (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      NVIM_VERSION: v0.12.6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Neovim
        shell: bash
        run: |
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)
              asset=nvim-linux-x86_64
              checksum=474430d53e6264f6d6dd18db42d6dc9df3a1b56ca9e88a325bbf860e1a811d87
              ;;
            Darwin-arm64)
              asset=nvim-macos-arm64
              checksum=1dbd148222b051ba6c307c4d17a318ed083df018a4f6a5a0ce46955ffc9ab87b
              ;;
            Darwin-x86_64)
              asset=nvim-macos-x86_64
              checksum=481424f1dbc85f637d57e47d27d042aa9c883e5a4fe9ee64fc4ee9573b221998
              ;;
            *) echo 'Unsupported runner architecture'; exit 1 ;;
          esac
          curl -fsSL --retry 3 "https://github.com/neovim/neovim/releases/download/${NVIM_VERSION}/${asset}.tar.gz" \
            -o "$RUNNER_TEMP/neovim.tar.gz"
          printf '%s  %s\n' "$checksum" "$RUNNER_TEMP/neovim.tar.gz" | shasum -a 256 --check -
          mkdir -p "$RUNNER_TEMP/neovim"
          tar -xzf "$RUNNER_TEMP/neovim.tar.gz" -C "$RUNNER_TEMP/neovim" --strip-components=1
          echo "$RUNNER_TEMP/neovim/bin" >> "$GITHUB_PATH"
      - name: Verify Neovim version
        run: nvim --version
      - name: Run Lua and native UI tests
        run: nvim --headless -u NONE -i NONE -l tests/run.lua
      - name: Install pinned Rex for configuration check
        if: runner.os == 'Linux'
        env:
          REX_COMMIT: c67cc2d0c88ecc86f5d751079b809dd9e9047636
          REX_SHA256: 26575255ac9f4eee4e58a382f3a596bfe4ee01061aceaf9855e480b129d2862c
        run: |
          curl -fsSL --retry 3 \
            "https://blob.superlogical.com/download/rex/preview/${REX_COMMIT}/rex-linux-amd64.tar.gz" \
            -o "$RUNNER_TEMP/rex.tar.gz"
          printf '%s  %s\n' "$REX_SHA256" "$RUNNER_TEMP/rex.tar.gz" | sha256sum --check -
          mkdir -p "$RUNNER_TEMP/rex-bin"
          tar -xzf "$RUNNER_TEMP/rex.tar.gz" -C "$RUNNER_TEMP/rex-bin"
          echo "$RUNNER_TEMP/rex-bin" >> "$GITHUB_PATH"
      - name: Check Rex entrypoint with real Lua 5.1 runtime
        if: runner.os == 'Linux'
        env:
          XDG_CONFIG_HOME: ${{ runner.temp }}/rex-config
          XDG_DATA_HOME: ${{ runner.temp }}/rex-data
          XDG_STATE_HOME: ${{ runner.temp }}/rex-state
        run: |
          rex version
          rex config check tests/rex-config.lua
